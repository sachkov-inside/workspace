<!doctype html>
<!--
  PROTOTYPE — throwaway. Workspace #185: единый путь согласий пользователя.
  Вопрос: как должен выглядеть сбор согласий при первом входе и управление ими в кабинете.
  Три варианта экрана первого входа (?variant=A|B|C) и общие экраны (?screen=...).
  Не встраивается в Platform и не является реализацией; тексты и версии — кандидатные.
  Визуальный язык повторяет Platform apps/web (public shell, Manrope, карточки rounded-2xl).
  Запуск: открыть файл в браузере. Параметр &bar=0 скрывает панель прототипа.
-->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Прототип #185 — согласия Inside</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Токены public shell из Platform apps/web/app/globals.css */
  :root {
    --background: #ffffff; --foreground: #202124; --card: #ffffff;
    --primary: #202124; --primary-foreground: #ffffff;
    --secondary: #f3f1ed; --muted: #f3f1ed; --muted-foreground: #5f5e59;
    --accent: #c7461e; --action: #b83a1d; --action-hover: #8f2c16;
    --border: rgb(32 33 36 / 8%); --input: rgb(32 33 36 / 14%); --ring: #c7461e;
    --destructive: oklch(0.5 0.2 27);
    --good: oklch(0.46 0.11 150);
    --radius: 0.875rem;
    --shadow-card: 0 1rem 2.5rem -2rem rgb(20 21 24 / 35%);
    --shadow-float: 0 1.5rem 4rem -1.25rem rgb(20 21 24 / 60%);
    --font-body: "Manrope", ui-sans-serif, system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, monospace;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--background); color: var(--foreground);
    font-family: var(--font-body); line-height: 1.5; -webkit-font-smoothing: antialiased; }
  a { color: var(--action); text-underline-offset: 4px; }
  a:hover { color: var(--action-hover); }
  button { font: inherit; }
  .muted { color: var(--muted-foreground); }
  .mono { font-family: var(--font-mono); font-size: 12px; }

  /* Шапка public shell */
  .site-header { display: flex; align-items: center; gap: 32px; height: 67px; padding: 0 94px;
    border-bottom: 1px solid var(--border); }
  .logo { font-weight: 800; font-size: 20px; letter-spacing: -0.03em; white-space: nowrap; }
  .logo span { color: var(--accent); }
  .site-nav { display: flex; gap: 26px; font-size: 14px; font-weight: 600; }
  .site-header .spacer { flex: 1; }
  .pill { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 14px;
    border-radius: 999px; background: var(--primary); color: #fff; font-size: 13px; font-weight: 700; }
  .mobile-nav { display: none; }

  .page { max-width: 1012px; margin: 0 auto; padding: 28px 24px 160px; }
  .narrow { max-width: 38rem; margin: 0 auto; }
  h1 { font-size: 40px; font-weight: 800; letter-spacing: -0.04em; line-height: 1.1; margin: 0; }
  h2 { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; margin: 0; }
  h3 { font-size: 14px; font-weight: 700; margin: 0; }
  .lead { margin: 10px 0 0; font-size: 15px; color: var(--muted-foreground); }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 1rem;
    box-shadow: var(--shadow-card); padding: 24px 28px; }
  .stack > * + * { margin-top: 16px; }
  .divider { border-top: 1px solid var(--border); margin: 22px 0; }
  .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--muted-foreground); }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px;
    padding: 0 18px; border-radius: 0.6rem; border: 1px solid transparent; background: var(--primary);
    color: var(--primary-foreground); font-size: 14px; font-weight: 600; cursor: pointer; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.outline { background: #fff; color: var(--foreground); border-color: var(--input); }
  .btn.ghost { background: transparent; color: var(--foreground); }
  .btn.danger { background: color-mix(in oklab, var(--destructive) 10%, #fff); color: var(--destructive); }
  .btn.sm { min-height: 34px; padding: 0 12px; font-size: 13px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

  /* Отметка — как ConsentChecklist в Platform: чекбокс слева, текст со ссылкой */
  .check { display: flex; gap: 12px; align-items: flex-start; font-size: 14px; line-height: 1.55; }
  .check input { margin-top: 2px; width: 20px; height: 20px; flex: none; accent-color: var(--primary); }
  .check .hint { display: block; margin-top: 2px; font-size: 13px; color: var(--muted-foreground); }
  .tag { display: inline-block; margin-left: 4px; font-size: 12px; color: var(--muted-foreground); }
  .req { color: var(--muted-foreground); font-size: 12px; font-weight: 600; }
  .group-title { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; margin-bottom: 12px; }
  .note { font-size: 13px; color: var(--muted-foreground); }
  .callout { border: 1px solid color-mix(in oklab, oklch(0.45 0.02 128) 28%, var(--border));
    background: color-mix(in oklab, oklch(0.45 0.02 128) 7%, #fff); border-radius: 0.8rem; padding: 12px 14px; font-size: 13px; }

  /* Кабинет */
  .cabinet { display: grid; grid-template-columns: 200px 1fr; gap: 34px; }
  .cabinet-nav .eyebrow { padding: 6px 12px 12px; }
  .cabinet-nav a { display: block; padding: 9px 12px; border-radius: 0.7rem; color: var(--foreground);
    text-decoration: none; font-size: 14px; font-weight: 600; }
  .cabinet-nav a.active { background: var(--secondary); color: var(--accent); }
  .section-header { border-bottom: 1px solid var(--border); padding-bottom: 26px; margin-bottom: 28px; }
  .section-header h1 { font-size: 44px; }
  .consent-row { display: grid; grid-template-columns: 1fr auto; gap: 8px 20px; padding: 16px 0;
    border-top: 1px solid var(--border); }
  .consent-row:first-of-type { border-top: 0; padding-top: 4px; }
  .status { font-size: 13px; font-weight: 600; }
  .status.on { color: var(--good); }
  .status.off { color: var(--muted-foreground); }
  .history li { display: grid; grid-template-columns: 150px 1fr; gap: 12px; padding: 8px 0;
    border-top: 1px solid var(--border); font-size: 13px; }
  .history { list-style: none; margin: 0; padding: 0; }

  /* Stepper */
  .steps { display: flex; gap: 6px; margin: 18px 0 22px; }
  .steps span { flex: 1; height: 4px; border-radius: 4px; background: var(--secondary); }
  .steps span.done { background: var(--primary); }

  /* Cookies */
  .cookie-bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: 88px; width: min(560px, calc(100% - 32px));
    background: #fff; border: 1px solid var(--border); border-radius: 1rem; box-shadow: var(--shadow-float);
    padding: 16px 18px; z-index: 30; }
  .fake-feed { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 24px; }
  .fake-cover { aspect-ratio: 4/3; border-radius: 1rem; }

  /* Telegram */
  .tg-wrap { display: grid; grid-template-columns: 360px 1fr; gap: 32px; align-items: start; }
  .tg { background: #dfe7ee; border-radius: 1.4rem; padding: 14px; font-size: 14px; }
  .tg-head { display: flex; align-items: center; gap: 10px; padding: 4px 6px 12px; font-weight: 700; }
  .tg-ava { width: 34px; height: 34px; border-radius: 50%; background: var(--primary); color: #fff;
    display: grid; place-items: center; font-size: 13px; }
  .bubble { background: #fff; border-radius: 14px 14px 14px 4px; padding: 10px 12px; margin: 8px 30px 4px 0; }
  .bubble.me { background: #e1f6cf; border-radius: 14px 14px 4px 14px; margin: 8px 0 4px auto; width: fit-content; }
  .tg-btns { display: grid; gap: 6px; margin: 6px 30px 8px 0; }
  .tg-btns button { background: rgb(255 255 255 / 70%); border: 0; border-radius: 10px; padding: 9px; font-weight: 600;
    color: #2a6fb0; cursor: pointer; }
  .tg-btns button.picked { background: #2a6fb0; color: #fff; }

  /* Диалог */
  dialog { border: 0; border-radius: 1rem; padding: 24px; max-width: 440px; box-shadow: var(--shadow-float); }
  dialog::backdrop { background: rgb(20 21 24 / 40%); }

  /* Панель прототипа: нарочно не похожа на продукт */
  .proto-state { margin-top: 28px; border: 2px dashed #7c3aed; border-radius: 0.8rem; padding: 12px 14px;
    background: #faf5ff; font-family: var(--font-mono); font-size: 12px; color: #3b0764; white-space: pre-wrap; }
  .proto-state b { font-family: var(--font-body); }
  .proto-bar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 50;
    display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px; max-width: calc(100% - 16px);
    background: #2e1065; color: #fff; padding: 6px; border-radius: 999px; box-shadow: 0 10px 30px rgb(46 16 101 / 45%);
    font-size: 12px; font-weight: 600; }
  .proto-bar button { background: transparent; color: #fff; border: 0; border-radius: 999px; padding: 6px 10px; cursor: pointer; font-size: 12px; }
  .proto-bar button.on { background: #fff; color: #2e1065; }
  .proto-bar .sep { width: 1px; height: 18px; background: rgb(255 255 255 / 30%); }
  .proto-label { padding: 0 6px; white-space: nowrap; }

  @media (width < 48rem) {
    .site-header { padding: 0 20px; height: 58px; }
    .site-nav, .site-header .search { display: none; }
    .page { padding: 20px 16px 190px; }
    h1 { font-size: 30px; }
    .section-header h1 { font-size: 34px; }
    .card { padding: 20px 18px; }
    .cabinet { grid-template-columns: 1fr; gap: 12px; }
    .cabinet-nav { display: flex; overflow-x: auto; gap: 4px; }
    .cabinet-nav .eyebrow { display: none; }
    .cabinet-nav a { white-space: nowrap; }
    .consent-row { grid-template-columns: 1fr; }
    .history li { grid-template-columns: 1fr; gap: 2px; }
    .fake-feed { grid-template-columns: 1fr; }
    .tg-wrap { grid-template-columns: 1fr; }
    .mobile-nav { display: flex; position: fixed; left: 50%; transform: translateX(-50%); bottom: 14px; z-index: 20;
      gap: 6px; padding: 6px; background: #fff; border-radius: 999px; box-shadow: var(--shadow-float); }
    .mobile-nav span { padding: 10px 14px; border-radius: 999px; font-size: 13px; font-weight: 700; }
    .mobile-nav span.on { background: var(--primary); color: #fff; }
    .proto-bar { bottom: 76px; border-radius: 1rem; }
    .cookie-bar { bottom: 150px; }
    .hide-bar .cookie-bar { bottom: 80px; }
  }
  .hide-bar .proto-bar, .hide-bar .mobile-nav { display: none; }
</style>
</head>
<body>
<header class="site-header">
  <div class="logo">Sachkov <span>Inside</span></div>
  <nav class="site-nav"><span>Главная</span><span>База знаний</span><span>Закладки</span></nav>
  <div class="spacer"></div>
  <span class="search muted" style="font-size:14px">Найти материал</span>
  <span class="pill">Аккаунт</span>
</header>

<main class="page" id="app"></main>

<nav class="mobile-nav" aria-hidden="true"><span>Главная</span><span>База</span><span class="on">Профиль</span></nav>

<dialog id="withdraw-dialog"></dialog>

<div class="proto-bar" id="proto-bar" role="toolbar" aria-label="Панель прототипа"></div>

<script>
// ---------------------------------------------------------------------------------------------
// Кандидатные ключи и версии документов. Номера сверены с каталогом Platform origin/main
// (см. consents-inventory.md); действующей остаётся старшая введённая версия.
// ---------------------------------------------------------------------------------------------
const DOCS = {
  terms: { title: "условия использования", version: 1, href: "/legal/terms" },
  privacy: { title: "политика персональных данных", version: 3, href: "/legal/privacy" },
  cookies: { title: "cookies и локальное хранение", version: 2, href: "/legal/cookies" },
  profile: { title: "согласие на показ данных профиля", version: 1, href: "/legal/consent-profile" },
  marketing: { title: "согласие на новости и предложения", version: 1, href: "/legal/consent-marketing" },
};

const params = new URLSearchParams(location.search);
const SCREENS = [
  ["signin", "Экран входа"],
  ["welcome", "Первый вход"],
  ["cookies", "Первое посещение"],
  ["telegram", "Вход через Telegram"],
  ["consents", "Кабинет: согласия"],
  ["profile", "Профиль"],
];
const VARIANTS = [
  ["A", "Один экран"],
  ["B", "Короткие шаги"],
  ["C", "Только нужное сейчас"],
];
let screen = params.get("screen") ?? "welcome";
let variant = params.get("variant") ?? "A";
if (params.get("bar") === "0") document.body.classList.add("hide-bar");

// Состояние прототипа в памяти: какие отметки стоят и какие события будут записаны.
const state = {
  terms: false, age: false, profile: false, marketingTelegram: false, marketingEmail: false,
  showBio: false, showAvatar: false,
  step: 0, events: [], cookieSeen: false, analytics: params.get("analytics") === "1",
  // Экран «Профиль» открывается формой создания профиля (согласия ещё нет); остальные экраны — с данным согласием.
  granted: { profile: params.get("screen") !== "profile", marketingTelegram: false, marketingEmail: false },
  tgChoice: null,
};

const viaTelegram = params.get("account") === "telegram";
// Ответ в боте до входа: yes | no | none. Экран первого входа показывает его и даёт изменить на месте.
const botAnswer = params.get("bot") ?? "yes";
if (viaTelegram && botAnswer === "yes") { state.marketingTelegram = true; }
const now = () => "2026-09-15T12:04:11+03:00";
function event(action, key, channel, surface) {
  const doc = DOCS[key];
  return `${action.padEnd(9)} ${key}@v${doc ? doc.version : "—"}  канал=${channel}  экран=${surface}  время=${now()}`;
}
const doc = (key, label) => `<a href="${DOCS[key].href}" target="_blank" rel="noreferrer">${label ?? DOCS[key].title}</a>`;

function setUrl() {
  const p = new URLSearchParams(location.search);
  p.set("screen", screen);
  if (screen === "welcome") p.set("variant", variant); else p.delete("variant");
  history.replaceState(null, "", `?${p.toString()}`);
}

function renderBar() {
  const bar = document.getElementById("proto-bar");
  const screenBtns = SCREENS.map(([id, label]) =>
    `<button data-screen="${id}" class="${id === screen ? "on" : ""}">${label}</button>`).join("");
  const current = VARIANTS.find(([id]) => id === variant);
  const variantPart = screen === "welcome"
    ? `<span class="sep"></span><button data-cycle="-1" aria-label="Предыдущий вариант">←</button>
       <span class="proto-label">${current[0]} (${current[1]})</span>
       <button data-cycle="1" aria-label="Следующий вариант">→</button>` : "";
  bar.innerHTML = `<span class="proto-label">ПРОТОТИП #185</span><span class="sep"></span>${screenBtns}${variantPart}`;
}

function cycle(delta) {
  const i = VARIANTS.findIndex(([id]) => id === variant);
  variant = VARIANTS[(i + delta + VARIANTS.length) % VARIANTS.length][0];
  resetWelcome();
  render();
}
function resetWelcome() {
  Object.assign(state, { terms: false, age: false, profile: false, marketingTelegram: false, marketingEmail: false, step: 0, events: [] });
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-screen],[data-cycle],[data-act]");
  if (!t) return;
  if (t.dataset.screen) { screen = t.dataset.screen; resetWelcome(); render(); }
  if (t.dataset.cycle) cycle(Number(t.dataset.cycle));
  if (t.dataset.act) act(t.dataset.act, t);
});
document.addEventListener("change", (e) => {
  const k = e.target.dataset?.field;
  if (k) { state[k] = e.target.checked; render(true); }
});
document.addEventListener("keydown", (e) => {
  if (screen !== "welcome") return;
  if (e.target.closest("input,textarea,[contenteditable]")) return;
  if (e.key === "ArrowLeft") cycle(-1);
  if (e.key === "ArrowRight") cycle(1);
});

function stateBlock(title, lines) {
  return `<div class="proto-state"><b>Прототип — ${title}</b>\n${lines.length ? lines.join("\n") : "пока ничего"}</div>`;
}

// ------------------------------------------------ экраны ------------------------------------------------

function requiredBlock() {
  return `
    <div class="group-title"><h3>Чтобы пользоваться аккаунтом</h3><span class="req">обязательно</span></div>
    <div class="stack">
      <label class="check"><input type="checkbox" data-field="terms" ${state.terms ? "checked" : ""}>
        <span>Принимаю ${doc("terms")}
        <span class="hint">Договор об аккаунте: вход, доступ к открытым материалам, сохранение прогресса.</span></span></label>
      <label class="check"><input type="checkbox" data-field="age" ${state.age ? "checked" : ""}>
        <span>Мне исполнилось 14 лет
        <span class="hint">Если вам нет 18, покупки оформляйте с согласия родителя или другого законного представителя.</span></span></label>
    </div>
    <p class="note" style="margin:14px 0 0">Данные для работы аккаунта мы обрабатываем по договору — согласие на это не нужно.
      Что именно и зачем, описано в ${doc("privacy", "политике персональных данных")}.</p>`;
}

function profileChoice() {
  return `<div class="stack" style="margin:10px 0 0 32px">
      <label class="check"><input type="checkbox" checked disabled><span>Имя <span class="tag">без имени профиля нет</span></span></label>
      <label class="check"><input type="checkbox" data-field="showBio" ${state.showBio ? "checked" : ""}><span>Описание «О себе»</span></label>
      <label class="check"><input type="checkbox" data-field="showAvatar" ${state.showAvatar ? "checked" : ""}><span>Изображение</span></label>
    </div>`;
}
function profileFields() {
  return ["имя", state.showBio ? "описание" : null, state.showAvatar ? "изображение" : null].filter(Boolean).join(", ");
}

function optionalBlock({ withProfile = true } = {}) {
  return `
    <div class="group-title"><h3>По желанию</h3><span class="req">можно изменить в кабинете</span></div>
    <div class="stack">
      ${withProfile ? `<label class="check"><input type="checkbox" data-field="profile" ${state.profile ? "checked" : ""}>
        <span>Разрешаю показывать участникам с доступом имя, описание и изображение, которые я заполню в профиле —
        ${doc("profile", "текст согласия")}
        <span class="hint">Без этого профиль не создаётся, а материалы и покупки работают так же.</span></span></label>` : ""}
      ${viaTelegram && botAnswer !== "none"
        ? `<div class="check"><span>Новости и предложения в Telegram:
            <b class="status ${state.marketingTelegram ? "on" : "off"}">${state.marketingTelegram
              ? (botAnswer === "yes" ? "разрешено в боте 15 сентября 2026, 12:02" : "разрешено сейчас")
              : (botAnswer === "no" ? "отказ в боте 15 сентября 2026, 12:02" : "отключено сейчас")}</b>
            <span class="hint">${doc("marketing", "Текст согласия")}</span></span>
            <button class="btn outline sm" style="margin-left:auto" data-act="toggle-bot-answer">${state.marketingTelegram ? "Отключить" : "Разрешить"}</button></div>`
        : viaTelegram
        ? `<label class="check"><input type="checkbox" data-field="marketingTelegram" ${state.marketingTelegram ? "checked" : ""}>
        <span>Присылать новости и предложения Inside в Telegram — ${doc("marketing", "текст согласия")}</span></label>`
        : `<p class="note" style="margin:0">Новости в Telegram бот спросит сам, когда вы подключите его в кабинете.</p>`}
      ${viaTelegram ? `<p class="note" style="margin:0">Новости на почту можно будет включить после добавления почты в кабинете.</p>`
        : `<label class="check"><input type="checkbox" data-field="marketingEmail" ${state.marketingEmail ? "checked" : ""}>
        <span>Присылать новости и предложения Inside на почту anna@example.com — ${doc("marketing", "текст согласия")}</span></label>`}
    </div>
    <p class="note" style="margin:14px 0 0">Письма о покупках, продлении и доступе приходят без этой отметки: это часть договора, а не реклама.</p>`;
}

function welcomeEvents(includeOptional = true) {
  const ev = [];
  if (state.terms) ev.push(event("accept", "terms", "web", "first-sign-in"));
  if (state.age) ev.push(`accept    age-14-plus  канал=web  экран=first-sign-in  время=${now()}`);
  if (includeOptional) {
    if (viaTelegram && botAnswer !== "none") {
      const changed = (botAnswer === "yes") !== state.marketingTelegram;
      ev.push(changed
        ? event(state.marketingTelegram ? "grant" : "withdraw", "marketing", "telegram", "first-sign-in")
        : `перенос ответа бота в журнал аккаунта: ${botAnswer === "yes" ? "grant" : "decline"} marketing@v1, исходное время 2026-09-15T12:02:40+03:00`);
    }
    if (state.profile) ev.push(event("grant", "profile", "web", "first-sign-in") + `  данные=[${profileFields()}]`);
    if (state.marketingTelegram && !(viaTelegram && botAnswer !== "none")) ev.push(event("grant", "marketing", "telegram", "first-sign-in"));
    if (state.marketingEmail) ev.push(event("grant", "marketing", "email", "first-sign-in"));
  }
  return ev;
}

function welcomeHeader(sub) {

function act(name, el) {
  if (name === "submit-welcome") {
    state.events = welcomeEvents(variant !== "C");
    if (state.profile) state.granted.profile = true;
    state.granted.marketingTelegram = state.marketingTelegram; state.granted.marketingEmail = state.marketingEmail;
    screen = "consents"; render();
  }
  if (name === "next") { state.step += 1; render(); }
  if (name === "skip-marketing") { state.marketingTelegram = false; state.marketingEmail = false; state.step += 1; render(); }
  if (name === "skip-profile") { state.profile = false; act("submit-welcome"); }
  if (name === "cookie-ok" || name === "cookie-necessary" || name === "cookie-analytics") { state.cookieSeen = true; render(); }
  if (name === "toggle-analytics") { state.analytics = !state.analytics; state.cookieSeen = false; render(); }
  if (name === "tg-yes") { state.tgChoice = "yes"; render(); }
  if (name === "tg-no") { state.tgChoice = "no"; render(); }
  if (name === "to-welcome") { location.search = `?screen=welcome&variant=A&account=telegram&bot=${state.tgChoice ?? "none"}`; }
  if (name === "to-telegram") { screen = "telegram"; render(); }
  if (name === "toggle-bot-answer") { state.marketingTelegram = !state.marketingTelegram; render(); }
  if (name === "toggle-profile-consent") { state.granted.profile = !state.granted.profile; state.profile = false; render(); }
  if (name === "grant") {
    const f = el.dataset.field; state.granted[f] = true;
    state.events.push(event("grant", f === "profile" ? "profile" : "marketing", f === "marketingEmail" ? "email" : f === "marketingTelegram" ? "telegram" : "web", "cabinet-consents"));
    render();
  }
  if (name === "withdraw") openWithdraw(el.dataset.field);
}

function openWithdraw(field) {
  const d = document.getElementById("withdraw-dialog");
  const text = field === "profile"
    ? "Профиль сразу перестанет быть виден участникам. Имя, описание и изображение будут удалены не позднее 30 дней. Материалы, покупки и подписка не изменятся."
    : "Новости и предложения перестанут приходить сразу. Сообщения о доступе и покупках продолжат приходить.";
  d.innerHTML = `<h2>Отозвать согласие?</h2><p class="note" style="font-size:14px">${text}</p>
    <div class="row" style="margin-top:16px"><button class="btn danger" id="confirm-withdraw">Отозвать</button>
    <button class="btn ghost" id="cancel-withdraw">Отмена</button></div>`;
  d.showModal();
  d.querySelector("#cancel-withdraw").onclick = () => d.close();
  d.querySelector("#confirm-withdraw").onclick = () => {
    state.granted[field] = false;
    state.events.push(event("withdraw", field === "profile" ? "profile" : "marketing", field === "marketingEmail" ? "email" : field === "marketingTelegram" ? "telegram" : "web", "cabinet-consents"));
    d.close(); render();
  };
}

function render() {
  setUrl();
  renderBar();
  const app = document.getElementById("app");
  const views = {
    welcome: { A: welcomeA, B: welcomeSteps, C: welcomeOnlyRequired }[variant] ?? welcomeA,
    signin: signinScreen, cookies: cookiesScreen, telegram: telegramScreen, consents: consentsScreen, profile: profileScreen,
  };
  const focusField = document.activeElement?.dataset?.field;
  app.innerHTML = (views[screen] ?? welcomeA)();
  if (focusField) app.querySelector(`[data-field="${focusField}"]`)?.focus();
}
render();
</script>
</body>
</html>
